<header class="site-header">
  <div class="shell nav-inner">
   <a
  class="brand"
  href="#inicio"
  aria-label="Bear Games, ir al inicio"
  (click)="closeMenu()"
>
  <span class="brand-symbol">
    <img
      src="/logo.png"
      alt="Logo de Bear Games"
      class="brand-logo"
    >
  </span>

  <span class="brand-copy">
    <strong>BEAR<span>GAMES</span></strong>
    <small>DIGITAL GAME STORE</small>
  </span>
</a>
    <form class="nav-search" role="search" (submit)="submitSearch($event)">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="6.4" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="search" [value]="shop.search()" (input)="updateSearch($event)" placeholder="Busca tu próximo juego..." aria-label="Buscar videojuegos">
      <button type="submit" class="nav-search-go" aria-label="Buscar">Buscar</button>
    </form>
    <nav class="nav-links" [class.open]="menuOpen()" aria-label="Menú principal">
      <a href="#inicio" (click)="closeMenu()">Inicio</a>
      <a href="#catalogo" (click)="closeMenu()">Catálogo</a>
      <a href="#precios" (click)="closeMenu()">Precios</a>
      <a href="#nosotros" (click)="closeMenu()">Nosotros</a>
      <button class="nav-text-button" type="button" (click)="shop.chatOpen.set(true); closeMenu()">Chat</button>
    </nav>
    <button type="button" class="cart-trigger" (click)="shop.cartOpen.set(true)" aria-label="Abrir carrito de compras">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M3 4h2l2 11h12l2-8H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.5" fill="currentColor"/><circle cx="18" cy="20" r="1.5" fill="currentColor"/></svg>
      <span>Carrito</span><strong class="cart-count">{{ shop.cartCount() }}</strong>
    </button>
    <button type="button" class="menu-trigger" (click)="menuOpen.set(!menuOpen())" [attr.aria-expanded]="menuOpen()" aria-label="Mostrar u ocultar menú">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>
